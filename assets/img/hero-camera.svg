<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Ilustrasi kamera CCTV mengawasi area">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b3f6b"/><stop offset="1" stop-color="#0a192f"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <radialGradient id="beam"><stop stop-color="#7dd3fc" stop-opacity=".55"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <path d="M0 300 640 210v190H0Z" fill="#0d2745" opacity=".7"/>
  <path d="M0 340 640 270v130H0Z" fill="#0a1f38"/>
  <ellipse cx="330" cy="278" rx="230" ry="105" fill="url(#beam)"/>
  <!-- gedung -->
  <g fill="#143457" opacity=".85">
    <path d="M36 250h92v150H36zM150 220h70v180h-70zM450 235h84v165h-84zM556 265h60v135h-60z"/>
  </g>
  <g fill="#38bdf8" opacity=".35">
    <path d="M52 270h16v16H52zM84 270h16v16H84zM52 302h16v16H52zM84 302h16v16H84zM166 240h14v14h-14zM192 240h14v14h-14zM166 272h14v14h-14zM192 272h14v14h-14zM466 258h14v14h-14zM494 258h14v14h-14zM466 290h14v14h-14zM572 286h14v14h-14z"/>
  </g>
  <!-- tiang -->
  <rect x="452" y="92" width="14" height="220" rx="3" fill="#94a3b8" opacity=".8"/>
  <path d="M430 312h58v8h-58z" fill="#64748b"/>
  <!-- kamera -->
  <g transform="translate(300 96)">
    <rect x="0" y="24" width="150" height="72" rx="16" fill="url(#body)"/>
    <path d="M150 34h56a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8h-56z" fill="#e2e8f0"/>
    <circle cx="40" cy="60" r="24" fill="#0f172a"/>
    <circle cx="40" cy="60" r="17" fill="#1e3a5f"/>
    <circle cx="40" cy="60" r="9" fill="#38bdf8" opacity=".9"/>
    <circle cx="35" cy="55" r="3" fill="#e0f2fe"/>
    <path d="M28 24h74l14-16h-30l-12 16z" fill="#94a3b8"/>
    <rect x="96" y="12" width="52" height="10" rx="5" fill="#64748b"/>
    <circle cx="122" cy="46" r="3" fill="#22c55e"/>
    <text x="96" y="78" font-family="Arial, sans-serif" font-size="9" fill="#475569" font-weight="bold">CCTV-01</text>
  </g>
  <!-- garis pandang -->
  <path d="M348 172 120 330M348 172 300 360" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6 8" opacity=".45" fill="none"/>
  <circle cx="120" cy="330" r="7" fill="#f87171" opacity=".9"/>
  <circle cx="300" cy="360" r="7" fill="#f87171" opacity=".9"/>
</svg>
